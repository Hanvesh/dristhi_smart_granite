global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
  - job_name: 'vision'
    static_configs:
      - targets: ['host.docker.internal:8001']
  - job_name: 'seigniorage'
    static_configs:
      - targets: ['host.docker.internal:8002']
  - job_name: 'omeps'
    static_configs:
      - targets: ['host.docker.internal:8003']
