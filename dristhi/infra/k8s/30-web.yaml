# The two SPAs (nginx). Each proxies /api/* to the gateway Service.
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: drishti
  labels: { app.kubernetes.io/name: portal, app.kubernetes.io/part-of: drishti }
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "drishti-web-backend"}'
spec:
  selector: { app.kubernetes.io/name: portal }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: drishti
  labels: { app.kubernetes.io/name: portal, app.kubernetes.io/part-of: drishti }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: portal }
  template:
    metadata:
      labels: { app.kubernetes.io/name: portal, app.kubernetes.io/part-of: drishti }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: portal
          image: ${REGISTRY}/portal:${TAG}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: robot-console
  namespace: drishti
  labels: { app.kubernetes.io/name: robot-console, app.kubernetes.io/part-of: drishti }
