# PostgreSQL 16 + PostGIS 3.4 (same image as infra/docker-compose.yml).
# Schema + seed come from infra/init/db (ConfigMap drishti-db-init, created by
# the deploy script) and run only on first start with an empty volume.
# Credentials live in Secret drishti-db (created once by the deploy script).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: drishti
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: drishti
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: drishti
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: drishti
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: drishti
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: ${REGISTRY}/postgis:16-3.4
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: drishti-db, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: drishti-db, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: drishti-db, key: POSTGRES_DB } }
            # Sub-directory: a fresh persistent disk has lost+found at its root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi }
            limits: { memory: 1Gi, ephemeral-storage: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: initdb
          configMap:
            name: drishti-db-init
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: drishti
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
