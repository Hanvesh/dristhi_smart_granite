  namespace: drishti
  labels: { app.kubernetes.io/name: seigniorage, app.kubernetes.io/part-of: drishti }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: seigniorage }
  template:
    metadata:
      labels: { app.kubernetes.io/name: seigniorage, app.kubernetes.io/part-of: drishti }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seigniorage
          image: ${REGISTRY}/seigniorage:${TAG}
          ports:
            - { name: http, containerPort: 8002 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
