# Backend: FastAPI gateway + the three compute services it calls.
# vision / seigniorage / omeps are ClusterIP-only (no auth; reached only by the gateway).
apiVersion: v1
kind: Service
metadata:
  name: vision
  namespace: drishti
  labels: { app.kubernetes.io/name: vision, app.kubernetes.io/part-of: drishti }
spec:
  selector: { app.kubernetes.io/name: vision }
  ports:
    - { name: http, port: 8001, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision
  namespace: drishti
  labels: { app.kubernetes.io/name: vision, app.kubernetes.io/part-of: drishti }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: vision }
  template:
    metadata:
      labels: { app.kubernetes.io/name: vision, app.kubernetes.io/part-of: drishti }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: vision
          image: ${REGISTRY}/vision:${TAG}
          ports:
            - { name: http, containerPort: 8001 }
          env:
            - { name: DRISHTI_VISION_BACKEND, value: mock }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: seigniorage
  namespace: drishti
  labels: { app.kubernetes.io/name: seigniorage, app.kubernetes.io/part-of: drishti }
spec:
  selector: { app.kubernetes.io/name: seigniorage }
  ports:
    - { name: http, port: 8002, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
