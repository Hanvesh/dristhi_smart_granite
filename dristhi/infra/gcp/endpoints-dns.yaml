# Cloud Endpoints service definition, used only for its Google-managed DNS
# record on cloud.goog:  ${HOST}  ->  ${IP}  (the GKE Ingress static IP).
# No ESP proxy is involved; the Ingress serves all traffic.
# Rendered and deployed by scripts/deploy_gke.sh (gcloud endpoints services deploy).
swagger: "2.0"
info:
  title: "${TITLE}"
  description: "DNS name for the DRISHTI demo on GKE."
  version: "1.0.0"
host: "${HOST}"
x-google-endpoints:
  - name: "${HOST}"
    target: "${IP}"
schemes:
  - "https"
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: OK
